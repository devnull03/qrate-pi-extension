name: Release

# Publishes the tarball qrate pins in `scripts/fetch-agent-runtime.*`. Push a tag like `v1.2.3`,
# or run this by hand on a branch to tag and release the version in its package.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify the tag matches package.json
        run: |
          packaged="$(node -p "require('./package.json').version")"
          version="$packaged"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          if [ "$version" != "$packaged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $packaged"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Package
        run: git archive --format=tar.gz --prefix="qrate-pi-extension-$VERSION/" -o "qrate-pi-extension-$VERSION.tar.gz" HEAD
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" "qrate-pi-extension-$VERSION.tar.gz" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
